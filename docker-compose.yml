name: birthday_bot

services:
  postgres:
    image: postgres:16
    container_name: birthday-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-birthday_bot}
      POSTGRES_USER: ${POSTGRES_USER:-birthday_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-birthday_bot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-birthday_bot} -d ${POSTGRES_DB:-birthday_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  birthday-bot:
    build:
      context: .
    container_name: birthday-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro

volumes:
  postgres_data:
